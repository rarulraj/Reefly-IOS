<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reefly</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p  { font-size: 15px; opacity: 0.75; margin: 0 0 20px; max-width: 320px; }
      button {
        padding: 12px 18px;
        border-radius: 12px;
        border: 0;
        background: #2563eb;
        color: white;
        font-weight: 600;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Reefly</h1>
      <p>We can't reach reeflycare.com right now. Check your connection and try again.</p>
      <button onclick="location.href='https://reeflycare.com'">Retry</button>
    </div>
  </body>
</html>
